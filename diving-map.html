<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界十大潛點地圖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020d1a;color:#d0e8f0;font-family:'Trebuchet MS',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:10px 20px;background:rgba(0,15,35,0.95);border-bottom:1px solid rgba(0,200,255,0.18);display:flex;align-items:center;gap:14px;flex-shrink:0}
header h1{font-size:18px;font-weight:400;letter-spacing:.18em;color:#80d8f0}
header h1 span{color:#00d4ff;font-weight:700}
.subtitle{font-size:11px;color:#3a6a80;letter-spacing:.1em;margin-left:auto}
.main{display:flex;flex:1;overflow:hidden}
.map-container{flex:1;position:relative;background:radial-gradient(ellipse at 50% 40%,#0d2a4a 0%,#020d1a 100%)}
svg#world{width:100%;height:100%;display:block}
.continent{fill:#1e3d2a;stroke:#2d5e3c;stroke-width:.7;opacity:.92}
.grid-line{stroke:rgba(80,140,190,0.10);stroke-width:.5;fill:none}
.equator{stroke:rgba(0,200,255,0.18);stroke-width:.8;stroke-dasharray:4,4;fill:none}
.marker-group{cursor:pointer}
.marker-group:hover .marker-dot{r:7;filter:url(#glow2)}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
@keyframes pulse2{0%{r:6;opacity:.7}100%{r:16;opacity:0}}
.p1{animation:pulse 2.2s ease-out infinite}
.p2{animation:pulse2 2.2s ease-out infinite .7s}
.marker-dot{fill:#00d4ff;transition:r .15s}
.marker-num{fill:#020d1a;font-size:8.5px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.sidebar{width:272px;background:rgba(3,14,32,0.97);border-left:1px solid rgba(0,200,255,0.12);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.sidebar h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#00d4ff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(0,200,255,0.18)}
.leg-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;transition:background .18s,border-color .18s;border:1px solid transparent}
.leg-item:hover{background:rgba(0,212,255,0.07);border-color:rgba(0,212,255,0.18)}
.leg-item.active{background:rgba(0,212,255,0.11);border-color:rgba(0,212,255,0.28)}
.leg-num{width:20px;height:20px;border-radius:50%;background:#00d4ff;color:#020d1a;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.leg-name{font-size:11.5px;font-weight:600;color:#b8e0f0;line-height:1.2}
.leg-loc{font-size:9.5px;color:#4a7a8a;margin-top:1px}
.info-card{position:fixed;background:rgba(4,18,42,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,212,255,0.28);border-radius:10px;padding:15px;width:228px;box-shadow:0 10px 36px rgba(0,0,0,.6),0 0 24px rgba(0,212,255,.08);z-index:200;pointer-events:none;display:none}
.info-card.show{display:block;animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.card-header{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.card-badge{width:22px;height:22px;border-radius:50%;background:#00d4ff;color:#020d1a;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-title{font-size:13.5px;font-weight:700;color:#9ad8f0;line-height:1.2}
.card-country{font-size:9.5px;color:#3a7090;text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.card-divider{border:none;border-top:1px solid rgba(0,212,255,0.13);margin:8px 0}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
.stat{background:rgba(0,212,255,0.05);border-radius:5px;padding:6px 8px}
.stat-label{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:#3a6a80;margin-bottom:2px}
.stat-val{font-size:11.5px;color:#7ad4ec;font-weight:600}
.card-marine{font-size:10px;color:#4a8a9a;line-height:1.55}
.card-marine b{color:#80c8e0}
.close-hint{position:absolute;top:8px;right:10px;font-size:16px;color:rgba(0,212,255,0.35);cursor:pointer;pointer-events:all;line-height:1}
.sea-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(0,212,255,0.15);animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(0) scale(1);opacity:.4}50%{opacity:.15}100%{transform:translateY(-40px) scale(0.5);opacity:0}}
</style>
</head>

<script>
const spots = [
  {name:"大堡礁",en:"Great Barrier Reef",country:"澳洲 AUSTRALIA",depth:"30m",vis:"30m+",season:"4–11月",level:"初–進階",marine:"<b>珊瑚礁魚</b>、海龜、礁鯊、蝠鱝、巨型礁石群，全球最大珊瑚礁系統"},
  {name:"藍洞",en:"Blue Hole",country:"貝里斯 BELIZE",depth:"120m",vis:"30m+",season:"4–6月",level:"進階",marine:"<b>雙髻鯊、牛鯊</b>、護士鯊、海龜，神秘的海底大藍洞，UNESCO遺址"},
  {name:"帛琉",en:"Palau",country:"密克羅尼西亞 PALAU",depth:"40m",vis:"30m",season:"11–4月",level:"中–進階",marine:"<b>蝠鱝、水母湖</b>、鯊魚、鯨鯊，珊瑚三角區核心"},
  {name:"紅海",en:"Red Sea",country:"埃及 EGYPT",depth:"40m",vis:"35m+",season:"3–5月",level:"初–進階",marine:"<b>拿破崙魚、長鰭笛鯛</b>、獅子魚、珊瑚礁，能見度極佳"},
  {name:"加拉巴哥群島",en:"Galápagos Islands",country:"厄瓜多 ECUADOR",depth:"30m",vis:"20m",season:"6–11月",level:"進階",marine:"<b>雙髻鯊、鯨鯊</b>、海獅、魟魚、海鬣蜥，野生動物天堂"},
  {name:"科摩多",en:"Komodo",country:"印尼 INDONESIA",depth:"30m",vis:"15m",season:"4–6月",level:"進階",marine:"<b>蝠鱝、海龍</b>、礁鯊、砲彈魚，強流富含養分"},
  {name:"馬爾地夫",en:"Maldives",country:"馬爾地夫 MALDIVES",depth:"30m",vis:"30m",season:"12–4月",level:"初–進階",marine:"<b>鯨鯊、蝠鱝</b>、礁鯊、海龜，印度洋珊瑚天堂"},
  {name:"詩巴丹島",en:"Sipadan Island",country:"馬來西亞 MALAYSIA",depth:"40m",vis:"30m",season:"4–10月",level:"中–進階",marine:"<b>綠蠵龜、雙髻鯊</b>、梭魚群、礁鯊，婆羅洲潛水聖地"},
  {name:"索科羅島",en:"Socorro Island",country:"墨西哥 MEXICO",depth:"50m",vis:"30m",season:"11–5月",level:"進階",marine:"<b>巨型蝠鱝、鯊魚</b>、海豚、鯨魚，太平洋「科拉巴哥」"},
  {name:"可可島",en:"Cocos Island",country:"哥斯大黎加 COSTA RICA",depth:"40m",vis:"30m",season:"6–11月",level:"進階",marine:"<b>雙髻鯊、鯨鯊</b>、大理石魟魚、鮣魚群，遠洋鯊魚天堂"}
];

// Build legend
const leg = document.getElementById('legend');
spots.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'leg-item';
  d.id = 'leg-'+i;
  d.innerHTML = `<div class="leg-num">${i+1}</div><div><div class="leg-name">${s.name}</div><div class="leg-loc">${s.en}</div></div>`;
  d.onclick = () => activateLegend(i);
  leg.appendChild(d);
});

let activeId = null;
function showCard(id, e) {
  e && e.stopPropagation();
  const s = spots[id];
  document.getElementById('cBadge').textContent = id+1;
  document.getElementById('cTitle').textContent = s.name;
  document.getElementById('cCountry').textContent = s.en + ' · ' + s.country.split(' ')[1];
  document.getElementById('cDepth').textContent = s.depth;
  document.getElementById('cVis').textContent = s.vis;
  document.getElementById('cSeason').textContent = s.season;
  document.getElementById('cLevel').textContent = s.level;
  document.getElementById('cMarine').innerHTML = s.marine;

  // Position card near click
  const card = document.getElementById('infoCard');
  card.classList.remove('show');
  void card.offsetWidth;

  let x = e ? e.clientX + 16 : 200;
  let y = e ? e.clientY - 20 : 200;
  if(x + 240 > window.innerWidth - 280) x = (e ? e.clientX : 400) - 250;
  if(y + 240 > window.innerHeight) y = window.innerHeight - 250;
  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.classList.add('show');

  // Highlight legend
  document.querySelectorAll('.leg-item').forEach(el => el.classList.remove('active'));
  document.getElementById('leg-'+id)?.classList.add('active');
  activeId = id;
}

function activateLegend(id) {
  // Simulate a click at center of map for that spot
  const card = document.getElementById('infoCard');
  const s = spots[id];
  document.getElementById('cBadge').textContent = id+1;
  document.getElementById('cTitle').textContent = s.name;
  document.getElementById('cCountry').textContent = s.en + ' · ' + s.country.split(' ')[1];
  document.getElementById('cDepth').textContent = s.depth;
  document.getElementById('cVis').textContent = s.vis;
  document.getElementById('cSeason').textContent = s.season;
  document.getElementById('cLevel').textContent = s.level;
  document.getElementById('cMarine').innerHTML = s.marine;

  card.style.left = '60px'; card.style.top = '80px';
  card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
  document.querySelectorAll('.leg-item').forEach(el => el.classList.remove('active'));
  document.getElementById('leg-'+id)?.classList.add('active');
}

function hideCard() {
  document.getElementById('infoCard').classList.remove('show');
  document.querySelectorAll('.leg-item').forEach(el => el.classList.remove('active'));
}
document.getElementById('mapContainer').addEventListener('click', e => {
  if(!e.target.closest('.marker-group')) hideCard();
});

// Floating sea particles
const pc = document.getElementById('particles');
for(let i=0;i<18;i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const sz = 2+Math.random()*4;
  p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*8}s`;
  pc.appendChild(p);
}
</script>

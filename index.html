<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>琉潛潛水行程費用計算器 🤿</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d3b6e 50%, #0a5c8a 100%);
      min-height: 100vh;
      color: #e8f4fd;
      padding: 24px 16px 60px;
    }

    .container { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }

    #oceanCanvas, #oceanFrontCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      image-rendering: pixelated;
    }
    #oceanFrontCanvas { z-index: 2; }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #7dd3fc;
      text-shadow: 0 0 20px rgba(125,211,252,0.4);
    }
    header p { color: #93c5fd; margin-top: 6px; font-size: 0.9rem; }

    .card {
      background: rgba(10,28,52,0.42);
      border: 1px solid rgba(125,211,252,0.2);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #7dd3fc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title span { font-size: 1.2rem; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .row:last-child { border-bottom: none; }

    .row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .price-tag {
      font-size: 0.75rem;
      color: #60a5fa;
      background: rgba(96,165,250,0.15);
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .row-label { font-size: 0.9rem; }
    .row-sub { font-size: 0.75rem; color: #93c5fd; }

    input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: #38bdf8;
      cursor: pointer;
      flex-shrink: 0;
    }

    input[type="number"] {
      width: 64px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(125,211,252,0.3);
      border-radius: 8px;
      color: #e8f4fd;
      font-size: 0.9rem;
      padding: 4px 8px;
      text-align: center;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56,189,248,0.2);
    }

    .nights-label { font-size: 0.8rem; color: #93c5fd; }

    .radio-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(125,211,252,0.2);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }
    .radio-option:hover { background: rgba(56,189,248,0.1); border-color: #38bdf8; }
    .radio-option input[type="radio"] {
      accent-color: #38bdf8;
      width: 15px; height: 15px;
    }
    .radio-option.selected {
      background: rgba(56,189,248,0.15);
      border-color: #38bdf8;
    }

    .qty-btn {
      width: 28px; height: 28px;
      background: rgba(56,189,248,0.15);
      border: 1px solid rgba(56,189,248,0.4);
      border-radius: 8px;
      color: #7dd3fc;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: rgba(56,189,248,0.3); }

    .scooter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #bfdbfe;
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 0;
    }
    .toggle {
      position: relative;
      width: 44px; height: 24px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 24px;
      cursor: pointer;
      transition: 0.3s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider { background: #0284c7; }
    input:checked + .slider:before { transform: translateX(20px); }
    .toggle-label { font-size: 0.85rem; }
    .toggle-label strong { color: #fbbf24; }

    .summary-card {
      background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(14,165,233,0.1));
      border: 1px solid rgba(56,189,248,0.4);
      border-radius: 16px;
      padding: 24px;
      position: sticky;
      bottom: 16px;
      background-color: rgba(10,28,52,0.72);
      backdrop-filter: blur(3px);
    }
    .summary-title {
      font-size: 1rem;
      font-weight: 700;
      color: #7dd3fc;
      margin-bottom: 14px;
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #bfdbfe;
      padding: 4px 0;
    }
    .summary-line.zero { opacity: 0.35; }
    .summary-divider {
      border: none;
      border-top: 1px solid rgba(125,211,252,0.3);
      margin: 12px 0;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .summary-total .label { font-size: 1rem; color: #7dd3fc; }

    .output-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .output-btn:hover { opacity: 0.85; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #0d2444;
      border: 1px solid rgba(125,211,252,0.3);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 1rem; font-weight: 700; color: #7dd3fc; }
    .modal-close {
      background: none; border: none;
      color: #93c5fd; font-size: 1.4rem;
      cursor: pointer; line-height: 1;
    }
    .detail-section { margin-bottom: 14px; }
    .detail-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #bfdbfe;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .detail-item:last-child { border-bottom: none; }
    .detail-divider {
      border: none;
      border-top: 1px solid rgba(125,211,252,0.25);
      margin: 14px 0;
    }
    .detail-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.8; }
    .btn-copy { background: rgba(56,189,248,0.2); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.4); }
    .btn-print { background: #0284c7; color: #fff; }
    .copied-hint {
      text-align: center;
      font-size: 0.75rem;
      color: #4ade80;
      margin-top: 8px;
      height: 16px;
    }

    @media print {
      body { background: #fff; color: #000; padding: 24px; }
      .container, .modal-overlay { display: block !important; }
      .card, .summary-card { display: none; }
      .modal-overlay { position: static; background: none; padding: 0; }
      .modal { border: none; background: none; padding: 0; max-height: none; }
      .modal-header, .modal-actions, .modal-close, .copied-hint { display: none !important; }
      .detail-section-title { color: #0369a1; }
      .detail-item, .detail-total { color: #000; }
      .detail-divider { border-color: #ccc; }
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.5rem; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
<canvas id="oceanCanvas"></canvas>
<canvas id="oceanFrontCanvas"></canvas>
<div class="container">
  <header>
    <h1>🤿 琉潛潛水行程費用計算器</h1>
  </header>

  <!-- 行程日期 -->
  <div class="card">
    <div class="card-title"><span>📅</span> 行程日期</div>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <input type="date" id="dateStart" oninput="calc()" style="flex:1; min-width:130px; background:rgba(255,255,255,0.1); border:1px solid rgba(125,211,252,0.3); border-radius:8px; color:#e8f4fd; font-size:0.9rem; padding:6px 10px; outline:none;">
      <span style="color:#93c5fd;">─</span>
      <input type="date" id="dateEnd" oninput="calc()" style="flex:1; min-width:130px; background:rgba(255,255,255,0.1); border:1px solid rgba(125,211,252,0.3); border-radius:8px; color:#e8f4fd; font-size:0.9rem; padding:6px 10px; outline:none;">
    </div>
  </div>

  <!-- 住宿 -->
  <div class="card">
    <div class="card-title"><span>🛏️</span> 住宿</div>
    <div class="radio-group" id="roomType">
      <label class="radio-option" onclick="setRoom(this)">
        <input type="radio" name="room" value="700"> 假日住宿 <span class="price-tag">700/晚</span>
      </label>
      <label class="radio-option" onclick="setRoom(this)">
        <input type="radio" name="room" value="600"> 平日住宿 <span class="price-tag">600/晚</span>
      </label>
      <label class="radio-option selected" onclick="setRoom(this)">
        <input type="radio" name="room" value="0" checked> 不住宿
      </label>
    </div>
    <div style="margin-top:14px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:0.85rem; color:#93c5fd;">住幾晚：</span>
      <input type="number" id="nights" value="2" min="0" max="5" oninput="calc()">
      <span class="nights-label">晚</span>
    </div>
  </div>

  <!-- 潛水活動 -->
  <div class="card">
    <div class="card-title"><span>🌊</span> 潛水活動</div>
    <div class="row">
      <div class="row-left">
        <div>
          <div class="row-label">夜潛</div>
          <div class="row-sub">1,050 元／次</div>
        </div>
      </div>
      <div class="row-right">
        <button class="qty-btn" onclick="stepQty('nightDive',-1)">－</button>
        <input type="number" id="nightDive" value="0" min="0" max="2" oninput="calc()" style="width:48px">
        <button class="qty-btn" onclick="stepQty('nightDive',1)">＋</button>
        <span class="nights-label">次</span>
      </div>
    </div>
    <div class="row">
      <div class="row-left">
        <div>
          <div class="row-label">岸潛</div>
          <div class="row-sub">600 元／次</div>
        </div>
      </div>
      <div class="row-right">
        <button class="qty-btn" onclick="stepQty('shoreDive',-1)">－</button>
        <input type="number" id="shoreDive" value="0" min="0" max="5" oninput="calc()" style="width:48px">
        <button class="qty-btn" onclick="stepQty('shoreDive',1)">＋</button>
        <span class="nights-label">次</span>
      </div>
    </div>
    <div class="row">
      <div class="row-left">
        <div>
          <div class="row-label">船潛</div>
          <div class="row-sub">3,000 元／次（共 2 支）</div>
        </div>
      </div>
      <div class="row-right">
        <button class="qty-btn" onclick="stepQty('boatDive',-1)">－</button>
        <input type="number" id="boatDive" value="0" min="0" max="2" oninput="calc()" style="width:48px">
        <button class="qty-btn" onclick="stepQty('boatDive',1)">＋</button>
        <span class="nights-label">次</span>
      </div>
    </div>
  </div>

  <!-- 交通 -->
  <div class="card">
    <div class="card-title"><span>🚢</span> 交通</div>
    <div class="row">
      <div class="row-left">
        <input type="checkbox" id="ferry" onchange="calc()">
        <label for="ferry"><div class="row-label">船票（來回）</div></label>
      </div>
      <span class="price-tag">420 元</span>
    </div>
    <div class="row" style="flex-direction:column; align-items:flex-start; gap:10px;">
      <div class="row-left">
        <input type="checkbox" id="scooter" onchange="calc()">
        <label for="scooter">
          <div class="row-label">機車租借</div>
          <div class="row-sub">400元/台/天</div>
        </label>
      </div>
      <div class="scooter-row">
        <span>騎幾天：</span>
        <input type="number" id="scooterDays" value="2" min="1" max="5" oninput="calc()" style="width:55px">
        <span>天，與</span>
        <input type="number" id="scooterPeople" value="2" min="1" max="4" oninput="calc()" style="width:55px">
        <span>人共乘（平均分攤）</span>
      </div>
    </div>
  </div>

  <!-- 裝備租借 -->
  <div class="card">
    <div class="card-title"><span>🎽</span> 裝備租借</div>
    <div class="toggle-wrap">
      <label class="toggle">
        <input type="checkbox" id="studentDiscount" onchange="calc()">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">琉浪學員 <strong>輕重裝八折優惠</strong></span>
    </div>
    <div style="margin-top:16px;">
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="mask" onchange="calc()">
          <label for="mask"><div class="row-label">面鏡</div></label>
          <span class="price-tag">100/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="maskDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="snorkel" onchange="calc()">
          <label for="snorkel"><div class="row-label">呼吸管</div></label>
          <span class="price-tag">100/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="snorkelDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="wetsuit" onchange="calc()">
          <label for="wetsuit"><div class="row-label">防寒衣</div></label>
          <span class="price-tag">150/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="wetsuitDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="boots" onchange="calc()">
          <label for="boots"><div class="row-label">套鞋</div></label>
          <span class="price-tag">50/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="bootsDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="fins" onchange="calc()">
          <label for="fins"><div class="row-label">蛙鞋</div></label>
          <span class="price-tag">100/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="finsDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="bcd" onchange="calc()">
          <label for="bcd"><div class="row-label">重裝（BCD+調節器）</div></label>
          <span class="price-tag">600/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="bcdDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="fullset" onchange="calc()">
          <label for="fullset"><div class="row-label">全套（輕裝+重裝）</div></label>
          <span class="price-tag">1,000/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="fullsetDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="computer" onchange="calc()">
          <label for="computer"><div class="row-label">電腦錶</div></label>
          <span class="price-tag">300/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="computerDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
      <div class="row">
        <div class="row-left">
          <input type="checkbox" id="torch" onchange="calc()">
          <label for="torch"><div class="row-label">手電筒</div></label>
          <span class="price-tag">200/天</span>
        </div>
        <div class="row-right">
          <input type="number" id="torchDays" value="1" min="1" max="5" oninput="calc()">
          <span class="nights-label">天</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-card">
    <div class="summary-title">💰 個人費用明細</div>
    <div class="summary-line" id="s-accommodation"><span>住宿</span><span>─</span></div>
    <div class="summary-line" id="s-diving"><span>潛水活動</span><span>─</span></div>
    <div class="summary-line" id="s-transport"><span>交通</span><span>─</span></div>
    <div class="summary-line" id="s-gear"><span>裝備租借</span><span>─</span></div>
    <hr class="summary-divider">
    <div class="summary-total">
      <span class="label">總計</span>
      <span id="s-total">0 元</span>
    </div>
    <button class="output-btn" onclick="openModal()">📋 查看完整明細 / 輸出</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">🤿 個人費用明細</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
    <hr class="detail-divider">
    <div class="detail-total">
      <span>總計</span>
      <span id="modalTotal">0 元</span>
    </div>
    <div class="modal-actions">
      <button class="action-btn btn-copy" onclick="copyDetail()">📋 複製文字</button>
      <button class="action-btn btn-print" onclick="printDetail()">🖨️ 列印 / 存 PDF</button>
    </div>
    <div class="copied-hint" id="copiedHint"></div>
  </div>
</div>

<script>
  let selectedRoom = 0;

  function setRoom(el) {
    document.querySelectorAll('.radio-option').forEach(r => r.classList.remove('selected'));
    el.classList.add('selected');
    selectedRoom = parseInt(el.querySelector('input').value) || 0;
    calc();
  }

  function stepQty(id, delta) {
    const el = document.getElementById(id);
    const min = parseInt(el.min) || 0;
    const max = parseInt(el.max) || 99;
    el.value = Math.min(max, Math.max(min, (parseInt(el.value) || 0) + delta));
    calc();
  }

  function n(id) { return document.getElementById(id); }
  function checked(id) { return n(id).checked; }
  function val(id) { return Math.max(0, parseInt(n(id).value) || 0); }

  function applyDiscount(amount) {
    return checked('studentDiscount') ? Math.round(amount * 0.8) : amount;
  }

  function calc() {
    const nights = val('nights');
    const accommodation = selectedRoom * nights;

    let diving = 0;
    diving += val('nightDive') * 1050;
    diving += val('shoreDive') * 600;
    diving += val('boatDive')  * 3000;

    let transport = 0;
    if (checked('ferry')) transport += 420;
    if (checked('scooter')) {
      const days = val('scooterDays');
      const people = Math.max(1, val('scooterPeople'));
      transport += Math.round((400 * days) / people);
    }

    let gear = 0;
    if (checked('mask'))     gear += applyDiscount(100  * val('maskDays'));
    if (checked('snorkel'))  gear += applyDiscount(100  * val('snorkelDays'));
    if (checked('wetsuit'))  gear += applyDiscount(150  * val('wetsuitDays'));
    if (checked('boots'))    gear += applyDiscount(50   * val('bootsDays'));
    if (checked('fins'))     gear += applyDiscount(100  * val('finsDays'));
    if (checked('bcd'))      gear += applyDiscount(600  * val('bcdDays'));
    if (checked('fullset'))  gear += applyDiscount(1000 * val('fullsetDays'));
    if (checked('computer')) gear += applyDiscount(300  * val('computerDays'));
    if (checked('torch'))    gear += applyDiscount(200  * val('torchDays'));

    const total = accommodation + diving + transport + gear;

    updateLine('s-accommodation', '住宿', accommodation);
    updateLine('s-diving', '潛水活動', diving);
    updateLine('s-transport', '交通', transport);
    updateLine('s-gear', '裝備租借' + (checked('studentDiscount') ? ' 🎓' : ''), gear);
    n('s-total').textContent = total.toLocaleString() + ' 元';
  }

  function updateLine(id, label, value) {
    const el = n(id);
    el.innerHTML = `<span>${label}</span><span>${value > 0 ? value.toLocaleString() + ' 元' : '─'}</span>`;
    el.className = 'summary-line' + (value === 0 ? ' zero' : '');
  }

  function buildDetail() {
    const discount = checked('studentDiscount');
    const nights = val('nights');
    const roomPrice = selectedRoom;
    const roomName = roomPrice === 700 ? '假日住宿' : roomPrice === 600 ? '平日住宿' : null;

    const sections = [];

    // 住宿
    if (roomName && nights > 0) {
      sections.push({ title: '住宿', items: [
        { label: `${roomName} × ${nights} 晚`, amount: roomPrice * nights }
      ]});
    }

    // 潛水
    const diveItems = [];
    if (val('nightDive') > 0) diveItems.push({ label: `夜潛 × ${val('nightDive')} 次`, amount: val('nightDive') * 1050 });
    if (val('shoreDive') > 0) diveItems.push({ label: `岸潛 × ${val('shoreDive')} 次`, amount: val('shoreDive') * 600 });
    if (val('boatDive')  > 0) diveItems.push({ label: `船潛 × ${val('boatDive')} 次`,  amount: val('boatDive')  * 3000 });
    if (diveItems.length) sections.push({ title: '潛水活動', items: diveItems });

    // 交通
    const transItems = [];
    if (checked('ferry')) transItems.push({ label: '船票（來回）', amount: 420 });
    if (checked('scooter')) {
      const days = val('scooterDays'), people = Math.max(1, val('scooterPeople'));
      transItems.push({ label: `機車 ${days}天 ÷ ${people}人`, amount: Math.round(400 * days / people) });
    }
    if (transItems.length) sections.push({ title: '交通', items: transItems });

    // 裝備
    const gearItems = [];
    const gearList = [
      ['mask','面鏡',100,'maskDays'], ['snorkel','呼吸管',100,'snorkelDays'],
      ['wetsuit','防寒衣',150,'wetsuitDays'], ['boots','套鞋',50,'bootsDays'],
      ['fins','蛙鞋',100,'finsDays'], ['bcd','重裝（BCD+調節器）',600,'bcdDays'],
      ['fullset','全套（輕裝+重裝）',1000,'fullsetDays'],
      ['computer','電腦錶',300,'computerDays'], ['torch','手電筒',200,'torchDays']
    ];
    gearList.forEach(([id, name, price, daysId]) => {
      if (!checked(id)) return;
      const d = val(daysId);
      const amt = applyDiscount(price * d);
      const discTag = discount ? ` (八折)` : '';
      gearItems.push({ label: `${name} × ${d} 天${discTag}`, amount: amt });
    });
    if (gearItems.length) sections.push({ title: `裝備租借${discount ? '（學生八折）' : ''}`, items: gearItems });

    return sections;
  }

  function openModal() {
    const sections = buildDetail();
    const total = sections.reduce((s, sec) => s + sec.items.reduce((a, i) => a + i.amount, 0), 0);

    let html = '';
    if (sections.length === 0) {
      html = '<p style="color:#93c5fd;font-size:0.9rem;text-align:center;padding:16px 0">尚未選擇任何項目</p>';
    } else {
      sections.forEach(sec => {
        html += `<div class="detail-section">
          <div class="detail-section-title">${sec.title}</div>`;
        sec.items.forEach(item => {
          html += `<div class="detail-item"><span>${item.label}</span><span>${item.amount.toLocaleString()} 元</span></div>`;
        });
        html += `</div>`;
      });
    }

    n('modalBody').innerHTML = html;
    n('modalTotal').textContent = total.toLocaleString() + ' 元';
    n('modalTitle').textContent = `🤿 個人費用明細${getDateLabel()}`;
    n('copiedHint').textContent = '';
    n('modalOverlay').classList.add('open');
  }

  function closeModal() { n('modalOverlay').classList.remove('open'); }
  function closeModalOutside(e) { if (e.target === n('modalOverlay')) closeModal(); }

  function getDateLabel() {
    const s = n('dateStart').value, e = n('dateEnd').value;
    if (!s && !e) return '';
    const fmt = v => { const d = new Date(v); return `${d.getMonth()+1}/${d.getDate()}`; };
    if (s && e) return `（${fmt(s)}–${fmt(e)}）`;
    if (s) return `（${fmt(s)}）`;
    return `（${fmt(e)}）`;
  }

  function copyDetail() {
    const sections = buildDetail();
    const total = sections.reduce((s, sec) => s + sec.items.reduce((a, i) => a + i.amount, 0), 0);
    let text = `🤿 琉潛潛水行程費用明細${getDateLabel()}\n`;
    text += '─'.repeat(28) + '\n';
    sections.forEach(sec => {
      text += `\n【${sec.title}】\n`;
      sec.items.forEach(item => {
        text += `  ${item.label.padEnd(18)}${item.amount.toLocaleString()} 元\n`;
      });
    });
    text += '\n' + '─'.repeat(28) + '\n';
    text += `總計：${total.toLocaleString()} 元`;

    navigator.clipboard.writeText(text).then(() => {
      n('copiedHint').textContent = '✓ 已複製到剪貼簿！';
      setTimeout(() => n('copiedHint').textContent = '', 2500);
    });
  }

    n('modalOverlay').classList.add('open');
    window.print();

      // 槌頭鯊：游最快
      addSwimmer({ frames: [hammerhead], scale: 4, speed: 34, band: [0.1, 0.5], bobAmp: 5 });
      // 翻車魚：幾乎用飄的
      addSwimmer({ frames: [mola], scale: 3, speed: 7, band: [0.25, 0.55], bobAmp: 16, bobSpd: 0.35, alpha: 0.9 });
      // 長尾鯊：長尾巴、速度快
      addSwimmer({ frames: [thresher], scale: 4, speed: 30, band: [0.08, 0.45], bobAmp: 6 });
      // 藍鯨：全場最大、貼近水面慢游
      addSwimmer({ frames: [blueWhale], scale: 6, speed: 8, band: [0.04, 0.28], bobAmp: 12, bobSpd: 0.3, alpha: 0.92 });
      // 儒艮：在下層海草區附近覓食
      addSwimmer({ frames: [dugong], scale: 4, speed: 10, band: [0.48, 0.72], bobAmp: 6, bobSpd: 0.45 });
      // 小魚群 ×2
      const school = [[0, 0], [16, 9], [13, -10], [30, 4], [26, 17], [37, -7], [46, 8], [41, 19]];
      addSwimmer({ frames: [fish], scale: 2, speed: 38, band: [0.15, 0.6], bobAmp: 4, offsets: school });
      addSwimmer({ frames: [fish], scale: 1, speed: 30, band: [0.2, 0.65], bobAmp: 4, offsets: school, alpha: 0.55 });
    }

    /* ---------- 水母（往上飄） ---------- */
    const jellies = [];
    function newJelly(randomY) {
      return {
        x: Math.random() * W,
        y: randomY ? Math.random() * H : H + 30,
        v: 9 + Math.random() * 8,
        scale: 3 + Math.floor(Math.random() * 2),
        ph: Math.random() * 6.28,
        fi: 0, ft: 0,
      };
    }
    function initJellies() {
      jellies.length = 0;
      for (let i = 0; i < 3; i++) jellies.push(newJelly(true));
    }

    /* ---------- 氣泡 ---------- */
    const bubbles = [];
    function newBubble(randomY) {
      return {
        x: Math.random() * W,
        y: randomY ? Math.random() * H : H + 10,
        s: 2 + Math.floor(Math.random() * 3) * 2,
        v: 22 + Math.random() * 34,
        ph: Math.random() * 6.28,
      };
    }
    function initBubbles() {
      bubbles.length = 0;
      for (let i = 0; i < 14; i++) bubbles.push(newBubble(true));
    }

    /* ---------- 沙地 + 珊瑚（靜態，預先畫好） ---------- */
    const PXF = 5; // 沙地像素大小
    function buildFloor() {
      const rows = 6;
      floorCanvas = document.createElement('canvas');
      floorCanvas.width = W;
      floorCanvas.height = rows * PXF;
      const f = floorCanvas.getContext('2d');
      const rnd = seeded(20260611);
      const sand = ['#b08f55', '#c2a263', '#9c7d4a', '#caa86b'];
      for (let r = 0; r < rows; r++) {
        for (let x = 0; x < W; x += PXF) {
          // 上緣鋸齒
          if (r === 0 && rnd() < 0.45) continue;
          f.fillStyle = sand[Math.floor(rnd() * sand.length)];
          f.fillRect(x, r * PXF, PXF, PXF);
        }
      }
      // 珊瑚
      const coralCols = ['#e0719a', '#e89c4f', '#9b6fd0'];
      const count = Math.max(2, Math.floor(W / 280));
      for (let i = 0; i < count; i++) {
        const cx = Math.floor(rnd() * (W - 60)) + 20;
        const col = coralCols[i % coralCols.length];
        f.fillStyle = col;
        const baseY = PXF; // 從沙地上緣長出來
        const branches = 2 + Math.floor(rnd() * 2);
        for (let b = 0; b < branches; b++) {
          const bx = cx + b * PXF * 2 - branches * PXF;
          const hgt = 2 + Math.floor(rnd() * 3);
          for (let s = 0; s < hgt; s++) f.fillRect(bx, baseY - s * PXF, PXF, PXF);
          f.fillRect(bx + (rnd() < 0.5 ? -PXF : PXF), baseY - hgt * PXF, PXF, PXF);
        }
      }
    }

    /* ---------- 海草（動態搖曳） ---------- */
    let weeds = [];
    function buildWeeds() {
      weeds = [];
      const rnd = seeded(77);
      const count = Math.max(4, Math.floor(W / 110));
      for (let i = 0; i < count; i++) {
        weeds.push({
          x: Math.floor(rnd() * W),
          segs: 6 + Math.floor(rnd() * 7),
          ph: rnd() * 6.28,
          col: rnd() < 0.5 ? '#1f7a4d' : '#2c9a62',
        });
      }
    }
    function drawWeeds(t) {
      const P = 5;
      for (const wd of weeds) {
        for (let s = 0; s < wd.segs; s++) {
          const sway = Math.sin(t * 1.1 + wd.ph + s * 0.5) * s * 0.45 * P * 0.4;
          ctx.fillStyle = s % 2 ? wd.col : '#1a6340';
          ctx.fillRect(Math.round(wd.x + sway), H - PXF * 2 - s * P, P, P);
        }
      }
    }

    /* ---------- 光束 ---------- */
    function drawRays(t) {
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const bx = ((t * 9 + i * (W + 240) / 3) % (W + 240)) - 120;
        const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
        g.addColorStop(0, 'rgba(125,211,252,0.07)');
        g.addColorStop(1, 'rgba(125,211,252,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(bx, 0);
        ctx.lineTo(bx + 70, 0);
        ctx.lineTo(bx + 150, H * 0.75);
        ctx.lineTo(bx + 30, H * 0.75);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    /* ---------- 主迴圈 ---------- */
    function drawSwimmer(e, t) {
      const img = e.frames[e.fi];
      const w = img.width * e.scale, h = img.height * e.scale;
      const y = e.yBase + Math.sin(t * e.bobSpd + e.phase) * e.bobAmp;
      ctx.save();
      ctx.globalAlpha = e.alpha;
      ctx.imageSmoothingEnabled = false;
      const draws = e.offsets || [[0, 0]];
      for (let i = 0; i < draws.length; i++) {
        const dx = draws[i][0] * e.scale, dy = draws[i][1] * e.scale;
        const my = e.offsets ? y + dy + Math.sin(t * 2 + i) * 3 : y;
        if (e.dir > 0) {
          ctx.save();
          ctx.translate(e.x + dx + w, my);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, w, h);
          ctx.restore();
        } else {
          ctx.drawImage(img, e.x - dx, my, w, h);
        }
      }
      ctx.restore();
    }

    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const t = now / 1000;
      ctx.clearRect(0, 0, W, H);

      drawRays(t);
      if (floorCanvas) ctx.drawImage(floorCanvas, 0, H - floorCanvas.height);
      drawWeeds(t);

      for (const e of swimmers) {
        e.x += e.speed * e.dir * dt;
        e.ft += dt;
        if (e.frames.length > 1 && e.ft > e.frameDur) { e.ft = 0; e.fi = (e.fi + 1) % e.frames.length; }
        const w = e.frames[0].width * e.scale;
        const extra = e.offsets ? 40 * e.scale : 0;
        if (e.dir > 0 && e.x > W + 30) respawn(e);
        if (e.dir < 0 && e.x < -w - extra - 30) respawn(e);
        drawSwimmer(e, t);
      }

      ctx.imageSmoothingEnabled = false;
      for (const j of jellies) {
        j.y -= j.v * dt;
        j.ft += dt;
        if (j.ft > 0.55) { j.ft = 0; j.fi = (j.fi + 1) % 2; }
        if (j.y < -60) Object.assign(j, newJelly(false));
        const img = j.fi ? jelly2 : jelly1;
        const jx = j.x + Math.sin(t * 0.8 + j.ph) * 14;
        ctx.drawImage(img, Math.round(jx), Math.round(j.y), img.width * j.scale, img.height * j.scale);
      }

      fctx.clearRect(0, 0, W, H);
      for (const b of bubbles) {
        b.y -= b.v * dt;
        if (b.y < -10) Object.assign(b, newBubble(false));
        const bx = b.x + Math.sin(t * 2 + b.ph) * 6;
        fctx.fillStyle = 'rgba(190,230,250,0.35)';
        fctx.fillRect(Math.round(bx), Math.round(b.y), b.s, b.s);
      }

      if (animate) requestAnimationFrame(tick);
    }

    function resize() {
      W = cv.width = fcv.width = innerWidth;
      H = cv.height = fcv.height = innerHeight;
      buildFloor();
      buildWeeds();
    }
    addEventListener('resize', resize);

    resize();
    initSwimmers();
    initJellies();
    initBubbles();

    const animate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    tick(performance.now());
  })();
</script>
</body>
</html>
